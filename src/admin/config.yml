            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Headline, name: title, widget: string }
              - { label: Intro paragraph, name: summary, widget: text }
              - { label: Fallback image, name: poster, widget: image, description: "Still image shown while the video loads (and if it cannot play). Best size: at least 1600 px on the long side." }
              - { label: Video File, name: video, widget: file, description: "Best size: at least 1600 px on the long side." }
              - { label: Video description (for screen readers), name: videoAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the video can't load." }
          - label: Intro Section
            name: intro
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - label: "Headline (one line per entry)"
                name: titleLines
                widget: list
                field: { label: Line, name: line, widget: string }
              - label: Body paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - { label: Side photo, name: image, widget: image, description: "Best size: at least 1600 px wide." }
              - { label: Photo description (for screen readers), name: imageAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the photo can't load." }
          - label: History Section
            name: history
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Title, name: title, widget: string }
              - label: Body paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - { label: Side photo, name: image, widget: image, description: "Best size: at least 1600 px wide." }
              - { label: Photo description (for screen readers), name: imageAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the photo can't load." }
          - label: Distribution Section
            name: distribution
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - label: "Headline (one line per entry)"
                name: titleLines
                widget: list
                field: { label: Line, name: line, widget: string }
              - label: Two side-by-side photos
                name: images
                widget: list
                description: "Exactly two photos are shown side by side — a third added here will not appear on the page."
                fields:
                  - { label: Image, name: src, widget: image, description: "Best size: at least 1600 px wide." }
                  - { label: Photo description (for screen readers), name: alt, widget: string, description: "Accessibility text read by screen readers, and shown if the photo can't load." }
              - label: Wholesale
                name: wholesale
                widget: object
                fields:
                  - { label: Small label, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
                  - label: Paragraphs
                    name: paragraphs
                    widget: list
                    field: { label: Paragraph, name: paragraph, widget: text }
              - label: Retail
                name: retail
                widget: object
                fields:
                  - { label: Small label, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
                  - label: Paragraphs
                    name: paragraphs
                    widget: list
                    field: { label: Paragraph, name: paragraph, widget: text }

  - name: contact_page
    label: Contact Page
    delete: false
    editor:
      preview: false
    files:
      - label: Contact Content
        name: contact
        file: src/_data/cms/contact.json
        format: json
        fields:
          - label: Hero
