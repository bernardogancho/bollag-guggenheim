  - name: brands_page
    label: BG Brands
    delete: false
    editor:
      preview: false
    files:
      - label: Hero
        name: brands_page_hero
        file: src/_data/cms/brandsPage/hero.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Title, name: title, widget: text }
              - { label: Summary, name: summary, widget: text }
              - { label: Stats, name: stats, widget: list, field: { label: Stat, name: stat, widget: string } }
              - { label: Hero Brand Name, name: brandName, widget: string }
              - { label: Hero Image, name: image, widget: image, description: "Best size: portrait, around 1200×1500 px." }
      - label: Portfolio Grid
        name: brands_page_portfolio
        file: src/_data/cms/brandsPage/portfolio.json
        format: json
        fields:
          - label: Portfolio Section
            name: portfolioSection
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Title, name: title, widget: string }
      - label: Brand Detail Page
        name: brands_page_detail
        file: src/_data/cms/brandsPage/detail.json
        format: json
        fields:
          - label: Brand Detail Page
            name: detailPage
            widget: object
            fields:
              - { label: Overview Eyebrow, name: overviewEyebrow, widget: string }
              - { label: Visual Journal Eyebrow, name: visualJournalEyebrow, widget: string }
              - { label: Visual Journal Title Template, name: visualJournalTitleTemplate, widget: string, description: "Heading for each brand's image gallery. Write {{name}} where the brand name should appear, e.g. '{{name}} — Visual Journal'." }
              - { label: CTA Eyebrow, name: ctaEyebrow, widget: string }
              - { label: CTA Title, name: ctaTitle, widget: string }
              - { label: CTA Button Label, name: ctaButtonLabel, widget: string }
              - { label: CTA Button Link, name: ctaButtonHref, widget: string }
      - label: Brand Entries
        name: brands_page_brands
        file: src/_data/cms/brandsPage/brands.json
        format: json
        fields:
          - label: Brands
            name: brands
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Slug, name: slug, widget: string, description: "The brand's web-address piece: lowercase, words joined by hyphens (e.g. 'cuoieria-fiorentina'). Changing it changes the page's URL." }
              - { label: Logo Image, name: logoImage, widget: image, required: false, description: "Use an SVG or a transparent PNG at least 400 px wide." }
              - label: Card on the Brands page
                name: card
                widget: object
                fields:
                  - { label: Card label, name: cardLabel, widget: string, required: false, description: "The small line above the logo on this brand's card in the Brands overview." }
                  - { label: Small label above the title, name: eyebrow, widget: string, required: false, description: "Short kicker line shown above the heading." }
                  - { label: Hero Title, name: heroTitle, widget: string, required: false }
                  - { label: Summary, name: summary, widget: text, required: false }
                  - { label: Photo, name: heroImage, widget: image, required: false, description: "Shown on the brand's card in the brands overview. Best size: portrait, around 1200×1500 px. (The homepage brand wall uses its own separate images, edited under Homepage.)" }
              - label: Detail page
                name: detail
                widget: object
                fields:
                  - { label: Intro, name: intro, widget: text, required: false }
