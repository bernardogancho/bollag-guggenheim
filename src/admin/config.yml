# Field manifest for the custom Bollag CMS admin (src/admin/app.jsx).
# This was originally a Decap/Netlify CMS config; the admin app only reads
# `collections` (labels, files, and field definitions). The former Decap
# backend keys (backend, local_backend, media_folder, site_url, ...) were
# unused by the custom app and have been removed.
collections:
  - name: site_settings
    label: Site Settings
    delete: false
    editor:
      preview: false
    files:
      - label: Header and Footer
        name: site
        file: src/_data/cms/site.json
        format: json
        fields:
          - label: Header navigation
            name: nav
            widget: object
            fields:
              - label: Left menu items
                name: left
                widget: list
                summary: "{{fields.label}} -> {{fields.href}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Right menu items
                name: right
                widget: list
                summary: "{{fields.label}} -> {{fields.href}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - label: Wearhouse Wordmark
                name: wearhouseWordmark
                widget: object
                fields:
                  - label: Small text under the Wearhouse logo
                    name: suffix
                    widget: list
                    field: { label: Line, name: line, widget: string }
              - label: Bollag-Guggenheim contact card
                name: bgContact
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Name, name: name, widget: string }
                  - label: Address
                    name: address
                    widget: list
                    field: { label: Line, name: line, widget: string }
                  - { label: Phone Label, name: phoneLabel, widget: string }
                  - { label: Phone Link, name: phoneHref, widget: string }
                  - { label: Email Label, name: emailLabel, widget: string }
                  - { label: Email Link, name: emailHref, widget: string }
                  - { label: Route Label, name: routeLabel, widget: string }
                  - { label: Route Link, name: routeHref, widget: string }
              - label: Wearhouse Contact
                name: wearhouseContact
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Name, name: name, widget: string }
                  - label: Address
                    name: address
                    widget: list
                    field: { label: Line, name: line, widget: string }
                  - { label: Phone Label, name: phoneLabel, widget: string }
                  - { label: Phone Link, name: phoneHref, widget: string }
                  - { label: Email Label, name: emailLabel, widget: string }
                  - { label: Email Link, name: emailHref, widget: string }
                  - { label: Route Label, name: routeLabel, widget: string }
                  - { label: Route Link, name: routeHref, widget: string }
              - label: Footer Navigation
                name: navigation
                widget: object
                fields:
                  - { label: Footer links heading, name: title, widget: string }
                  - label: Footer page links
                    name: items
                    widget: list
                    summary: "{{fields.label}} -> {{fields.href}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
              - label: Legal Notice
                name: legal
                widget: object
                fields:
                  - { label: Legal column heading, name: title, widget: string }
                  - label: Legal links
                    name: links
                    widget: list
                    summary: "{{fields.label}} -> {{fields.href}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
              - label: Footer Meta
                name: meta
                widget: object
                fields:
                  - { label: Founding tagline, name: since, widget: string }
                  - label: "Group name (bottom bar)"
                    name: groupName
                    widget: string

  - name: homepage
    label: Homepage
    delete: false
    editor:
      preview: false
    files:
      - label: Hero
        name: home_hero
        file: src/_data/cms/home/hero.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Headline, name: title, widget: string }
              - label: "Subheading (small line under the headline)"
                name: subline
                widget: string
              - { label: Fallback image, name: poster, widget: image, description: "Still image shown while the video loads (and if it cannot play). Best size: a wide photo around 2560×1440 px." }
              - { label: Background video, name: video, widget: file }
              - { label: Video description (for screen readers), name: videoAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the video can't load, e.g. 'Atelier craftspeople at work'." }
              - { label: Focus point — phones, name: mobileObjectPosition, widget: string, description: "Which part of the video stays visible when the screen crops it." }
              - { label: Focus point — tablets, name: smallObjectPosition, widget: string, description: "Which part of the video stays visible when the screen crops it." }
              - { label: Focus point — large screens, name: desktopObjectPosition, widget: string, description: "Which part of the video stays visible when the screen crops it." }
      - label: Introduction
        name: home_intro
        file: src/_data/cms/home/intro.json
        format: json
        fields:
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Headline, name: title, widget: text }
              - { label: Body text, name: summary, widget: text }
              - { label: Button text, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaHref, widget: string }
              - { label: Photo, name: image, widget: image, description: "Best size: at least 1200 px wide." }
              - { label: Photo description (for screen readers), name: imageAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the photo can't load." }
      - label: Bollag portfolio
        name: home_brands_wall
        file: src/_data/cms/home/brandsWall.json
        format: json
        fields:
          - label: Bollag Portfolio
            name: brandsWall
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Section heading, name: title, widget: string, description: "These logos/photos are a separate homepage-only list — editing a brand on the Brands page does not change them here." }
              - { label: Section text, name: summary, widget: text }
              - label: Brand Cards
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Brand name, name: name, widget: string, description: "Used as the logo's accessibility text; not shown as visible text." }
                  - { label: Logo (always shown), name: logoImage, widget: image }
                  - { label: Photo (appears on hover), name: heroImage, widget: image, required: false, description: "Best size: portrait, around 1200×1500 px." }
                  - { label: Link, name: href, widget: string }
      - label: Wearhouse portfolio
        name: home_wearhouse_wall
        file: src/_data/cms/home/wearhouseWall.json
        format: json
        fields:
          - label: Wearhouse Portfolio
            name: wearhouseWall
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Section heading, name: title, widget: string, description: "These logos/photos are a separate homepage-only list — editing a brand on the Wearhouse page does not change them here." }
              - { label: Section text, name: summary, widget: text }
              - label: Brand Cards
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Photo (appears on hover), name: hoverImage, widget: image, required: false, description: "Best size: portrait, around 1200×1500 px." }
                  - { label: Category label (small text above the name), name: segment, widget: string }
                  - { label: Brand name, name: name, widget: string }
                  - { label: Link to brand page, name: pageHref, widget: string }
      - label: Editorial selection
        name: home_selection
        file: src/_data/cms/home/selectionSection.json
        format: json
        fields:
          - label: Editorial Selection
            name: selection
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "The small grey label above the heading on the Company page (not shown on the homepage)." }
              - { label: Section heading, name: title, widget: string, description: "This section also appears on the Company page." }
              - { label: Social feed (Contentfry ID), name: feedId, widget: string, required: false, description: "Paste a Contentfry display ID (e.g. malina/all-2) to show a social feed instead of the image mosaic on the homepage." }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.brand}}"
                fields:
                  - { label: Photo, name: image, widget: image, description: "Best size: at least 1600 px on the long side." }
                  - { label: Brand name, name: brand, widget: string }
                  - { label: Caption, name: note, widget: string }
                  - { label: Link to brand page, name: href, widget: string }
                  - { label: Tile size, name: size, widget: select, options: ["standard", "wide", "tall", "feature"], description: "How big this photo appears in the grid." }

  - name: company
    label: Company Page
    delete: false
    editor:
      preview: false
    files:
      - label: Company Content
        name: company
        file: src/_data/cms/company.json
        format: json
        fields:
          - label: Hero
            name: hero
