              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: "Quote (optional, above the headline)", name: quote, widget: string, required: false }
              - { label: Page title, name: title, widget: string }
              - { label: Page summary, name: summary, widget: text }
              - { label: Fallback image, name: poster, widget: image, description: "Still image shown while the video loads (and if it cannot play). Best size: a wide photo around 2560×1440 px." }
              - { label: Video File, name: video, widget: file }
              - { label: Video description (for screen readers), name: videoAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the video can't load." }
          - label: "Section intro (office + form)"
            name: officeSection
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Title, name: title, widget: string, description: "Heading shown above BOTH the office cards and the contact form." }
              - { label: Summary, name: summary, widget: text }
          - label: Bollag Office
            name: office
            widget: object
            fields:
              - { label: Company name, name: name, widget: string }
              - { label: Address lines, name: address, widget: list, field: { label: Line, name: line, widget: string } }
              - { label: "Phone (shown to visitors)", name: phoneLabel, widget: string }
              - { label: "Phone link (tel:)", name: phoneHref, widget: string }
              - { label: Fax number, name: fax, widget: string }
              - { label: "Email (shown to visitors)", name: emailLabel, widget: string }
              - { label: "Email link (mailto:)", name: emailHref, widget: string }
              - { label: Route map PDF link, name: routeMapHref, widget: string }
              - { label: Google Maps link, name: googleMapsHref, widget: string }
          - label: Wearhouse Partner
            name: wearhousePartner
            widget: object
            fields:
              - { label: Card label, name: sectionLabel, widget: string }
              - { label: Company name, name: name, widget: string }
              - { label: Address lines, name: address, widget: list, field: { label: Line, name: line, widget: string } }
              - { label: "Phone (shown to visitors)", name: phoneLabel, widget: string }
              - { label: "Phone link (tel:)", name: phoneHref, widget: string }
              - { label: "Email (shown to visitors)", name: emailLabel, widget: string }
              - { label: "Email link (mailto:)", name: emailHref, widget: string }
              - { label: Google Maps link, name: mapsHref, widget: string }
          - label: Form Copy
            name: form
            widget: object
            fields:
              - { label: Card label, name: sectionLabel, widget: string }
              - { label: Form title, name: title, widget: string }
              - { label: Form intro text, name: summary, widget: text }
              - { label: "Reassurance text (next to the submit button)", name: disclaimer, widget: text }
              - { label: Submit button text, name: buttonLabel, widget: string }
              - label: Field Labels
                name: fields
                widget: object
                fields:
                  - { label: "'First name' field label", name: firstName, widget: string }
                  - { label: "'Last name' field label", name: lastName, widget: string }
                  - { label: "'Email' field label", name: email, widget: string }
                  - { label: "'Company' field label", name: company, widget: string }
                  - { label: "'Subject' field label", name: subject, widget: string }
                  - { label: "'Message' field label", name: message, widget: string }
              - label: Placeholders
                name: placeholders
                widget: object
                fields:
                  - { label: "'First name' placeholder", name: firstName, widget: string }
                  - { label: "'Last name' placeholder", name: lastName, widget: string }
                  - { label: "'Email' placeholder", name: email, widget: string }
                  - { label: "'Company' placeholder", name: company, widget: string }
                  - { label: "'Subject' placeholder", name: subject, widget: string }
                  - { label: "'Message' placeholder", name: message, widget: string }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Closing headline, name: title, widget: string }
              - { label: Primary button text, name: buttonLabel, widget: string }
              - { label: Primary button link, name: buttonHref, widget: string }
              - { label: "Secondary button text (optional)", name: secondaryButtonLabel, widget: string, required: false }
              - { label: "Secondary button link (optional)", name: secondaryButtonHref, widget: string, required: false }

  - name: stores_page
    label: Stores Page
    delete: false
    editor:
      preview: false
    files:
      - label: Stores Content
        name: stores
        file: src/_data/cms/stores.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Headline, name: title, widget: string }
              - { label: Intro paragraph, name: summary, widget: text }
              - { label: Fallback image, name: poster, widget: image, description: "Still image shown while the video loads (and if it cannot play). Best size: a wide photo around 2560×1440 px." }
              - { label: Video File, name: video, widget: file }
              - { label: Video description (for screen readers), name: videoAlt, widget: string, description: "Accessibility text read by screen readers, and shown if the video can't load." }
          - label: Hero stat badges
            name: heroStats
            widget: list
            description: "Short stat chips under the hero text, e.g. '30+ Stores'. Leave blank to hide."
            field: { label: Stat, name: stat, widget: string }
          - label: Network Section
            name: networkSection
            widget: object
            fields:
              - { label: Small label above the title, name: eyebrow, widget: string, description: "Short kicker line shown above the heading." }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Store Groups
            name: groups
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Group eyebrow, name: label, widget: string, description: "Short kicker line shown above the group name." }
              - { label: Group name, name: title, widget: string, description: "The group heading; also shown as a small label on each store photo below." }
              - { label: Group description, name: intro, widget: text }
              - label: Stores in this group
                name: stores
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Store photo, name: image, widget: image, description: "Best size: at least 1200 px wide." }
                  - { label: Store name, name: name, widget: string }
                  - { label: Address, name: address, widget: list, field: { label: Line, name: line, widget: string } }
                  - { label: "Phone (shown to visitors)", name: phoneLabel, widget: string }
                  - { label: "Phone link (tel:)", name: phoneHref, widget: string }
                  - { label: Opening hours, name: hours, widget: list, field: { label: Line, name: line, widget: string } }

